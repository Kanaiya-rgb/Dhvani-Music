<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dhvani_bg" x1="120" y1="80" x2="904" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="45%" stop-color="#FA233B"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="dhvani_symbol" x1="256" y1="224" x2="768" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F3"/>
    </linearGradient>
    <filter id="glow" x="150" y="150" width="724" height="724" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FA233B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="1024" height="1024" rx="228" fill="url(#dhvani_bg)"/>

  <!-- Subtle Top Ambient Light -->
  <circle cx="320" cy="240" r="300" fill="white" fill-opacity="0.08"/>

  <!-- Dhvani Monogram Mark: "D" + Equalizer Waves + Sound Resonance + Playhead -->
  <g filter="url(#glow)">
    <!-- Equalizer Stem Bar 1 (Leftmost, rhythmic) -->
    <rect x="256" y="384" width="56" height="256" rx="28" fill="url(#dhvani_symbol)"/>

    <!-- Equalizer Stem Bar 2 (Middle, rising) -->
    <rect x="344" y="304" width="56" height="416" rx="28" fill="url(#dhvani_symbol)"/>

    <!-- Equalizer Stem Bar 3 (Spine of 'D', full resonant height) -->
    <rect x="432" y="224" width="56" height="576" rx="28" fill="url(#dhvani_symbol)"/>

    <!-- Outer 'D' Resonance Arc -->
    <path d="M 460 252 C 630 252, 740 368, 740 512 C 740 656, 630 772, 460 772" 
          stroke="url(#dhvani_symbol)" stroke-width="56" stroke-linecap="round" fill="none"/>

    <!-- Inner Sound Resonance Wave -->
    <path d="M 470 362 C 555 362, 620 428, 620 512 C 620 596, 555 662, 470 662" 
          stroke="url(#dhvani_symbol)" stroke-width="44" stroke-linecap="round" fill="none"/>

    <!-- Center Acoustic Play Pulse -->
    <path d="M 468 476 C 468 468, 477 463, 484 467 L 546 503 C 553 507, 553 517, 546 521 L 484 557 C 477 561, 468 556, 468 548 Z" 
          fill="url(#dhvani_symbol)"/>
  </g>
</svg>
